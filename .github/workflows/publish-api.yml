name: Publish API to Reposilite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-rafter-api
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check publishing credentials
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$MAVEN_USERNAME" || -z "$MAVEN_PASSWORD" ]]; then
            echo "::error::Configure the MAVEN_USERNAME and MAVEN_PASSWORD repository secrets."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21 and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          server-id: hiusers-releases
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD

      - name: Build and save deployment JAR for ABI verification
        run: |
          bash ./gradlew :plugin:build -x test --no-daemon
          mkdir -p build/api-verification
          if [[ ! -f plugin/build/libs/Rafter.jar ]]; then
            echo "::error::Deployment JAR was not produced: plugin/build/libs/Rafter.jar"
            exit 1
          fi
          cp -f plugin/build/libs/Rafter.jar build/api-verification/Rafter.jar

      - name: Build development API JAR
        run: bash ./gradlew taboolibBuildApi -PDeleteCode -x test --no-daemon

      - name: Verify API JAR and read version
        id: api
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          JAR_FILE="project/api/build/libs/rafter-api-${VERSION}-api.jar"
          if [[ -z "$VERSION" || ! -f "$JAR_FILE" ]]; then
            echo "::error::Expected API JAR not found: $JAR_FILE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify API ABI against deployment JAR
        run: |
          bash ./gradlew :project:api:verifyApiAbi \
            -PrafterVerificationPluginJar=build/api-verification/Rafter.jar \
            --no-daemon

      - name: Reject an already published API version
        env:
          API_VERSION: ${{ steps.api.outputs.version }}
        run: |
          BASE_URL="https://repo.hiusers.com/releases/com/hiusers/rafter/rafter-api/${API_VERSION}/rafter-api-${API_VERSION}"
          for EXTENSION in pom jar; do
            ARTIFACT_URL="${BASE_URL}.${EXTENSION}"
            HTTP_STATUS=$(curl --silent --show-error --location \
              --connect-timeout 15 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' "$ARTIFACT_URL") || {
                echo "::error::Unable to check existing API artifact: $ARTIFACT_URL"
                exit 1
              }
            case "$HTTP_STATUS" in
              200)
                echo "::error::Refusing to overwrite existing API artifact: $ARTIFACT_URL"
                exit 1
                ;;
              404) ;;
              *)
                echo "::error::Unexpected HTTP status while checking API artifact: $HTTP_STATUS"
                exit 1
                ;;
            esac
          done

      - name: Publish API JAR and POM to Reposilite
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          API_VERSION: ${{ steps.api.outputs.version }}
          API_JAR: ${{ steps.api.outputs.jar }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=hiusers-releases \
            -Durl=https://repo.hiusers.com/releases \
            -DgroupId=com.hiusers.rafter \
            -DartifactId=rafter-api \
            "-Dversion=$API_VERSION" \
            -Dpackaging=jar \
            "-Dfile=$API_JAR" \
            -DgeneratePom=true
