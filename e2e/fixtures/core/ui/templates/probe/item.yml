id: rafterprobe:slot
component:
  id: cell
  type: group
  elements:
    - id: frame
      type: image
      asset: rafter:probe/slot
      width: 36
      height: 36
      fit: stretch
    - id: icon
      type: item
      item: rafterprobe:items#row
      size: 36
      actions:
        - type: select-item
        - type: provider
          provider: rafterprobe:click
    - id: label
      type: text
      y: 36
      width: 48
      overflow: clip
      text:
        format: literal
        binding:
          type: item
          key: id
