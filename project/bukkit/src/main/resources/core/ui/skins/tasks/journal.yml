          y: 291
          width: 96
          overflow: "clip"
          align: "center"
          text:
            format: "literal"
            value: "追踪任务"
            color: "#1C1F20"
          visible:
            type: "not"
            condition:
              type: "equals"
              binding:
                type: "record"
                source: "tasks"
                state: "selected-task"
                key: "phase"
              value: "ready"
          variants:
            -
              when:
                type: "equals"
                binding:
                  type: "record"
                  source: "tasks"
                  state: "selected-task"
                  key: "phase"
                value: "claimed"
