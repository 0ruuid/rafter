            -
              when:
                type: "equals"
                binding:
                  type: "record"
                  source: "tasks"
                  state: "selected-task"
                  key: "phase"
                value: "locked"
              override:
                text:
                  format: "literal"
                  value: "未解锁"
                  color: "#888A8B"
            -
              when:
                type: "equals"
                binding:
                  type: "record"
                  source: "tasks"
                  state: "selected-task"
                  key: "phase"
                value: "expired"
              override:
                text:
                  format: "literal"
                  value: "已过期"
                  color: "#888A8B"
            -
              when:
                type: "equals"
                binding:
                  type: "record"
                  source: "tasks"
                  state: "selected-task"
                  key: "tracked"
                value: true
              override:
                text:
                  format: "literal"
                  value: "取消追踪"
                  color: "#1C1F20"
        -
          id: "claim-label"
          type: "text"
          x: 460
          y: 291
          width: 40
          overflow: "clip"
          align: "center"
          text:
            format: "literal"
            value: "领取奖励"
            color: "#FAFAFA"
          visible:
            type: "equals"
            binding:
              type: "record"
              source: "tasks"
              state: "selected-task"
              key: "phase"
            value: "ready"
        -
          id: "primary"
          type: "slot"
          required: true
          component:
            type: "hit-area"
            target: "primary-art"
            enabled:
              type: "any"
              conditions:
                -
                  type: "equals"
                  binding:
                    type: "record"
                    source: "tasks"
                    state: "selected-task"
                    key: "phase"
                  value: "ready"
                -
                  type: "equals"
                  binding:
                    type: "record"
                    source: "tasks"
                    state: "selected-task"
                    key: "phase"
                  value: "active"
            actions: []
        -
          id: "goal-page"
          type: "text"
          x: 656
          y: 291
          width: 144
          overflow: "clip"
          align: "center"
