          x: 248
          y: 266
          width: 100
          text:
            format: literal
            value: 已解锁
            color: "#A9ACAD"
        - id: badge-explorer
          type: template
          key: rafter:player-profile/badge
          params:
            x: 264
            y: 207
            asset: rafter:player-profile/badges/explorer
            name:
              format: literal
              binding:
                type: record
                source: profile
                state: selected-player
                key: explorer-name
              color: "#CDCFD0"
            description:
              format: literal
              binding:
                type: record
                source: profile
                state: selected-player
                key: explorer-description
              color: "#CDCFD0"
            visible:
              type: equals
              binding:
                type: record
                source: profile
                state: selected-player
                key: explorer-unlocked
              value: true
        - id: badge-builder
          type: template
          key: rafter:player-profile/badge
