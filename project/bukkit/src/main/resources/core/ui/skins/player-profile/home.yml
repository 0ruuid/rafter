              binding:
                type: record
                source: profile
                state: selected-player
                key: helper-description
              color: "#CDCFD0"
            visible:
              type: equals
              binding:
                type: record
                source: profile
                state: selected-player
                key: helper-unlocked
              value: true
        - id: empty-badges
          type: text
          x: 248
          y: 224
          width: 288
          text:
            format: literal
            value: 暂无精选成就
            color: "#A9ACAD"
          visible:
            type: all
            conditions:
              - type: not
                condition:
                  type: equals
                  binding:
                    type: record
                    source: profile
                    state: selected-player
                    key: explorer-unlocked
                  value: true
              - type: not
                condition:
                  type: equals
                  binding:
                    type: record
                    source: profile
                    state: selected-player
                    key: builder-unlocked
                  value: true
              - type: not
                condition:
                  type: equals
                  binding:
                    type: record
                    source: profile
                    state: selected-player
                    key: helper-unlocked
                  value: true
        - id: count
          type: text
          x: 536
          y: 266
          width: 176
          text:
            format: parts
            color: "#CDCFD0"
            parts:
              - format: literal
                binding:
                  type: record
                  source: profile
                  state: selected-player
                  key: unlocked
                color: "#CDCFD0"
              - " / "
              - format: literal
                binding:
                  type: record
                  source: profile
                  state: selected-player
                  key: total
                color: "#CDCFD0"
