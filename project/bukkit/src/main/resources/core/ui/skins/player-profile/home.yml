              binding:
                type: record
                source: profile
                state: selected-player
                key: builder-name
              color: "#CDCFD0"
            description:
              format: literal
              binding:
                type: record
                source: profile
                state: selected-player
                key: builder-description
              color: "#CDCFD0"
            visible:
