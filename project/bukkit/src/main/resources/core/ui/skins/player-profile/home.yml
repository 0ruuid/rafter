id: rafter:player-profile/home
page:
  mode: canvas
  title: ""
  width: 560
  height: 342
  elements:
    - id: window
      type: image
      asset: rafter:player-profile/background
      x: 0
      y: 0
    - id: back-image
      type: image
      asset: rafter:player-profile/back
      x: 12
      y: 8
    - id: back-hit
      type: hit-area
      target: back-image
      actions:
        - type: close
      tooltip: 返回游戏
    - id: close-image
      type: image
      asset: rafter:player-profile/close
      x: 528
      y: 8
    - id: close-hit
      type: hit-area
      target: close-image
      actions:
        - type: close
      tooltip: 关闭玩家资料
    - id: heading
      type: text
      x: 40
      y: 12
      width: 248
      text:
        format: literal
        value: 玩家资料
        color: "#FAFAFA"
    - id: notice
      type: slot
      component:
        type: text
        x: 516
        y: 12
        width: 208
        align: right
      required: true
      text-style:
        color: "#A9ACAD"
    - id: equipment
      type: group
      elements:
        - id: equipment-title
          type: text
          x: 24
          y: 58
          width: 52
          text:
            format: literal
            value: 装备
            color: "#A9ACAD"
        - id: avatar-title
          type: text
          x: 138
          y: 58
          width: 100
          text:
            format: literal
            value: 玩家形象
            color: "#A9ACAD"
          align: center
        - id: equipment-note
          type: text
          x: 24
          y: 276
          width: 188
          text:
            format: literal
            value: 装备仅供查看 · 暂无快照
            color: "#A9ACAD"
        - id: equipment-90
          type: text
          x: 56
          y: 90
          width: 20
          text:
            format: literal
            value: 头盔
            color: "#A9ACAD"
        - id: equipment-126
          type: text
          x: 56
          y: 126
          width: 20
          text:
            format: literal
            value: 胸甲
            color: "#A9ACAD"
        - id: equipment-162
          type: text
          x: 56
          y: 162
          width: 20
          text:
            format: literal
            value: 护腿
            color: "#A9ACAD"
        - id: equipment-198
          type: text
          x: 56
          y: 198
          width: 20
          text:
            format: literal
            value: 靴子
            color: "#A9ACAD"
        - id: main-hand
          type: text
          x: 108
          y: 224
          width: 28
          text:
            format: literal
            value: 主手
            color: "#A9ACAD"
          align: center
        - id: off-hand
          type: text
          x: 168
          y: 224
          width: 28
          text:
            format: literal
            value: 副手
            color: "#A9ACAD"
          align: center
    - id: info
      type: group
      visible:
        type: not
        condition:
          type: equals
          binding:
            type: record
            source: profile
            state: selected-player
            key: id
          value: null
      elements:
        - id: name
          type: text
          x: 248
          y: 58
          width: 288
          text:
            format: literal
            binding:
              type: record
              source: profile
              state: selected-player
              key: name
            color: "#FAFAFA"
        - id: title
          type: text
          x: 248
          y: 82
          width: 204
          text:
            format: literal
            binding:
              type: record
              source: profile
              state: selected-player
              key: title
            color: "#CDCFD0"
        - id: status-dot
          type: image
          asset: rafter:player-profile/online
          x: 464
          y: 85
          variants:
            - when:
                type: not
                condition:
                  type: all
                  conditions:
                    - type: not
                      condition:
                        type: equals
                        binding:
                          type: record
                          source: profile
                          state: selected-player
                          key: id
                        value: null
                    - type: equals
                      binding:
                        type: record
                        source: profile
                        state: selected-player
                        key: online
                      value: true
              override:
                asset: rafter:player-profile/offline
        - id: status
          type: text
          x: 476
          y: 82
          width: 60
          text:
            format: literal
            value: 在线
            color: "#CDCFD0"
          variants:
            - when:
                type: not
                condition:
                  type: all
                  conditions:
                    - type: not
                      condition:
                        type: equals
                        binding:
                          type: record
                          source: profile
                          state: selected-player
                          key: id
                        value: null
                    - type: equals
                      binding:
                        type: record
                        source: profile
                        state: selected-player
                        key: online
                      value: true
              override:
                text:
                  format: literal
                  value: 离线
                  color: "#A9ACAD"
        - id: level
          type: text
          x: 248
          y: 104
          width: 72
          text:
            format: parts
            color: "#CDCFD0"
            parts:
              - "等级 "
              - format: literal
                binding:
                  type: record
                  source: profile
                  state: selected-player
                  key: level
                color: "#CDCFD0"
        - id: guild
          type: text
          x: 332
          y: 104
          width: 204
          text:
            format: parts
            color: "#A9ACAD"
            parts:
              - "公会 · "
              - format: literal
                binding:
                  type: record
                  source: profile
                  state: selected-player
                  key: guild
                color: "#A9ACAD"
        - id: playtime-label
          type: text
          x: 248
          y: 136
          width: 76
          text:
            format: literal
            value: 累计在线
            color: "#A9ACAD"
        - id: playtime
          type: text
          x: 336
          y: 136
          width: 200
          text:
            format: literal
            binding:
              type: record
              source: profile
              state: selected-player
              key: playtime
            color: "#CDCFD0"
        - id: joined-label
          type: text
          x: 248
          y: 158
          width: 76
          text:
            format: literal
            value: 加入时间
            color: "#A9ACAD"
        - id: joined
          type: text
          x: 336
          y: 158
          width: 200
          text:
            format: literal
            binding:
              type: record
              source: profile
              state: selected-player
              key: joined
            color: "#CDCFD0"
        - id: achievement-title
