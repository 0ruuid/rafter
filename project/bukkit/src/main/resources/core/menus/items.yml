# Canvas 物品叶节点示例；只使用原版材料，不连接业务提供器。
id: rafter:items
entry: home
permission: rafter.use
state:
  friends-page: 0
  categories-page: 0
  friends-selected: ''
  categories-selected: ''
data:
  friends:
    type: document
    key: preview:friends
  categories:
    type: document
    key: preview:task-types
pages:
  home:
    mode: canvas
    title: ""
    width: 432
    height: 144
    elements:
      - id: title
        type: text
        x: 36
        y: 9
        text: 物品展示
      - id: hint
        type: text
        x: 36
        y: 27
        text: 选择下方物品
      - id: navigation
        type: group
        elements:
          - id: hero
            type: item
            item: minecraft:diamond
            size: 36
            x: 36
            y: 45
            actions:
              - type: open-page
                page: hero
          - id: row
            type: item
            item: minecraft:emerald
            size: 18
            x: 126
            y: 54
            actions:
              - type: open-page
                page: row
          - id: grid
            type: item
            item: minecraft:gold_ingot
            size: 18
            x: 198
            y: 54
            actions:
              - type: open-page
                page: grid
          - id: slots
            type: item
            item: minecraft:iron_ingot
            size: 18
            x: 270
            y: 54
            actions:
              - type: open-page
                page: slots
          - id: lists
            type: item
            item: minecraft:book
            size: 18
            x: 342
            y: 54
            actions:
              - type: open-page
                page: lists
      - id: hero-label
        type: text
        x: 54
        y: 90
        width: 72
        text: 大图展示
        align: center
      - id: row-label
        type: text
        x: 135
        y: 90
        width: 54
        text: 单排
        align: center
      - id: grid-label
        type: text
        x: 207
        y: 90
        width: 54
        text: 多排网格
        align: center
      - id: slots-label
        type: text
        x: 279
        y: 90
        width: 54
        text: 不规则
        align: center
      - id: lists-label
        type: text
        x: 351
        y: 90
        width: 54
        text: 双分页
        align: center
      - id: footer
        type: text
        x: 36
        y: 117
        text: 所有点击仅用于页面导航演示

  hero:
    mode: canvas
    title: ""
    width: 432
    height: 144
    elements:
      - id: title
        type: text
        x: 36
        y: 9
        text: 较大物品
      - id: item-stage
        type: group
        elements:
          - id: diamond
            type: item
            item: minecraft:diamond
            size: 54
            x: 189
            y: 36
      - id: note
        type: text
        x: 216
        y: 99
        width: 252
        text: size 54 · 数量区域额外预留
        align: center
      - id: back-label
        type: text
        x: 54
        y: 117
        width: 72
        text: 返回
        align: center
      - id: back
        type: hit-area
        x: 18
        y: 117
        width: 72
        height: 18
        actions:
          - type: back

  row:
    mode: canvas
    title: ""
    width: 432
    height: 135
    elements:
      - id: title
        type: text
        x: 36
        y: 9
        text: 单排物品
      - id: row-items
        type: group
        elements:
          - id: diamond
            type: item
            item: minecraft:diamond
            size: 18
            x: 37
            y: 54
          - id: emerald
            type: item
            item: minecraft:emerald
            size: 18
            x: 64
            y: 54
          - id: gold
            type: item
            item: minecraft:gold_ingot
            size: 18
            x: 91
            y: 54
          - id: iron
            type: item
            item: minecraft:iron_ingot
            size: 18
            x: 118
            y: 54
          - id: coal
            type: item
            item: minecraft:coal
            size: 18
            x: 145
            y: 54
          - id: redstone
            type: item
            item: minecraft:redstone
            size: 18
            x: 172
            y: 54
      - id: note
        type: text
        x: 36
        y: 81
        text: 6 个 size 18 叶节点；x 不要求网格对齐
      - id: back-label
        type: text
        x: 54
        y: 108
        width: 72
        text: 返回
        align: center
      - id: back
        type: hit-area
        x: 18
        y: 108
        width: 72
        height: 18
        actions:
          - type: back

  grid:
    mode: canvas
    title: ""
    width: 432
    height: 180
    elements:
      - id: title
        type: text
        x: 36
        y: 9
        text: 多排网格
      - id: grid-items
        type: group
        elements:
          - id: diamond
            type: item
            item: minecraft:diamond
            size: 36
            x: 90
            y: 45
          - id: emerald
            type: item
            item: minecraft:emerald
            size: 36
            x: 135
            y: 45
          - id: gold
            type: item
            item: minecraft:gold_ingot
            size: 36
            x: 180
            y: 45
          - id: iron
            type: item
            item: minecraft:iron_ingot
            size: 36
            x: 90
            y: 90
          - id: lapis
            type: item
            item: minecraft:lapis_lazuli
            size: 36
            x: 135
            y: 90
          - id: redstone
            type: item
            item: minecraft:redstone
            size: 36
            x: 180
            y: 90
      - id: note
        type: text
        x: 153
        y: 135
        width: 126
        text: 3 × 2 · size 36
        align: center
      - id: back-label
        type: text
        x: 54
        y: 153
        width: 72
        text: 返回
        align: center
      - id: back
        type: hit-area
        x: 18
        y: 153
        width: 72
        height: 18
        actions:
          - type: back

  slots:
    mode: canvas
    title: ""
    width: 432
    height: 198
    elements:
      - id: title
        type: text
        x: 36
        y: 9
        text: 不规则摆放与空槽
      - id: item-stage
        type: group
        elements:
          - id: diamond
            type: item
            item: minecraft:diamond
            size: 18
            x: 36
            y: 45
          - id: emerald
            type: item
            item: minecraft:emerald
            size: 18
            x: 63
            y: 45
          - id: gold
            type: item
            item: minecraft:gold_ingot
            size: 18
            x: 117
            y: 45
          - id: iron
            type: item
            item: minecraft:iron_ingot
            size: 18
            x: 72
            y: 72
          - id: lapis
            type: item
            item: minecraft:lapis_lazuli
            size: 18
            x: 126
            y: 72
          - id: redstone
            type: item
            item: minecraft:redstone
            size: 18
            x: 36
