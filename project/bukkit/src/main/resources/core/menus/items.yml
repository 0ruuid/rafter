            type: item
            item: minecraft:quartz
            size: 18
            x: 90
            y: 108
          - id: amethyst
            type: item
            item: minecraft:amethyst_shard
            size: 18
            x: 171
            y: 108
          - id: coal
            type: item
            item: minecraft:coal
            size: 18
            x: 252
            y: 135
      - id: note
        type: text
        x: 36
        y: 162
        text: 空槽由显式位置之间的间隔保留，不引入物品专用网格
      - id: back-label
        type: text
        x: 54
        y: 180
        width: 72
        text: 返回
        align: center
      - id: back
        type: hit-area
        x: 18
        y: 180
        width: 72
        height: 18
        actions:
          - type: back

  lists:
    mode: canvas
    title: ""
    width: 864
    height: 216
    elements:
      - id: title
        type: text
        x: 20
        y: 9
        text: 两个独立分页区域
      - id: friends-prev-label
        type: text
        x: 287
        y: 9
        width: 54
        text: 上一页
        align: center
      - id: friends-prev
        type: hit-area
        x: 260
        y: 9
        width: 54
        height: 18
        actions:
          - type: page-list
            list: friends-list
            step: -1
        enabled:
          type: equals
          binding:
            type: list
            list: friends-list
            key: has-previous
          value: true
      - id: friends-next-label
        type: text
        x: 347
        y: 9
        width: 54
        text: 下一页
        align: center
      - id: friends-next
        type: hit-area
        x: 320
        y: 9
        width: 54
        height: 18
        actions:
          - type: page-list
            list: friends-list
            step: 1
        enabled:
          type: equals
          binding:
            type: list
            list: friends-list
            key: has-next
          value: true
      - id: categories-prev-label
        type: text
        x: 687
        y: 9
        width: 54
        text: 上一页
        align: center
      - id: categories-prev
        type: hit-area
        x: 660
        y: 9
        width: 54
        height: 18
        actions:
          - type: page-list
            list: categories-list
            step: -1
        enabled:
          type: equals
          binding:
            type: list
            list: categories-list
            key: has-previous
          value: true
      - id: categories-next-label
        type: text
        x: 747
        y: 9
        width: 54
        text: 下一页
        align: center
      - id: categories-next
        type: hit-area
        x: 720
        y: 9
        width: 54
        height: 18
        actions:
          - type: page-list
            list: categories-list
            step: 1
        enabled:
          type: equals
          binding:
            type: list
            list: categories-list
            key: has-next
          value: true
      - id: back-label
        type: text
        x: 816
        y: 9
        width: 72
        text: 返回
        align: center
      - id: back
        type: hit-area
        x: 780
        y: 9
        width: 72
        height: 18
        actions:
          - type: back
      - id: friends-heading
        type: text
        x: 20
        y: 36
        text: 旅伴
      - id: friends-page
        type: text
        x: 374
        y: 36
        width: 114
        text:
          format: parts
          parts:
            - "页 "
            - format: literal
              binding:
                type: list
                list: friends-list
                key: page
            - " / "
            - format: literal
              binding:
                type: list
                list: friends-list
                key: pages
        align: right
      - id: categories-heading
        type: text
        x: 420
        y: 36
        text: 收藏
      - id: categories-page
        type: text
        x: 774
        y: 36
        width: 114
        text:
          format: parts
          parts:
            - "页 "
            - format: literal
              binding:
                type: list
                list: categories-list
                key: page
            - " / "
            - format: literal
              binding:
                type: list
                list: categories-list
                key: pages
        align: right
      - id: friends-list
        type: list
        x: 20
        y: 63
        source: friends
        template: rafter:items/slot
        page-state: friends-page
        selection-state: friends-selected
        slots:
          - {x: 0, y: 0}
          - {x: 54, y: 0}
          - {x: 108, y: 0}
          - {x: 0, y: 54}
          - {x: 54, y: 54}
          - {x: 108, y: 54}
        params:
          material: minecraft:emerald
      - id: categories-list
        type: list
        x: 420
        y: 63
        source: categories
        template: rafter:items/slot
        page-state: categories-page
        selection-state: categories-selected
        slots:
          - {x: 0, y: 0}
          - {x: 72, y: 0}
          - {x: 0, y: 72}
          - {x: 90, y: 72}
        params:
          material: minecraft:clock
          name-field: label
